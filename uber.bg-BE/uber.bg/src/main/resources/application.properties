spring.application.name=uber.bg
spring.datasource.url = jdbc:postgresql://localhost:5432/UBER_BG
spring.datasource.username = postgres
spring.datasource.password = Pomegranata414
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto=update

spring.security.user.name=uber.bg
spring.security.user.password=uber.bg

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG

spring.data.redis.host = localhost
spring.data.redis.port = 6379

spring.data.mongodb.uri=mongodb://localhost:27017/chat_database
logging.level.org.springframework.messaging=DEBUG
